name: CI — Backend (avec .NET)
on:
  push:
    paths:
      - 'Backend/**'
      - '.github/workflows/ci-backend.yml'
  pull_request:
    paths:
      - 'Backend/**'


jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        working-directory: Backend
        run: |
          dotnet restore ./API/API.csproj
          dotnet restore ./Tests/Tests.csproj

      - name: Build
        working-directory: Backend
        run: |
          dotnet build -c Release --no-restore ./API/API.csproj
          dotnet build -c Release --no-restore ./Tests/Tests.csproj
      - name: Run tests
        working-directory: Backend
        run: dotnet test ./Tests/Tests.csproj -c Release --no-build --logger "console;verbosity=detailed"
        
      - name: Build Docker image
        run: |
          docker build -f Backend/DOCKERFILE -t unprompted/backend:${{ github.sha }} Backend/
          docker tag unprompted/backend:${{ github.sha }} unprompted/backend:latest

      - name: Security scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: unprompted/backend:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true


      - name: Push to registry
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' 
        run: |
          echo ${{ secrets.REGISTRY_PASSWORD }} | docker login ${{ secrets.REGISTRY_URL }} \
            -u ${{ secrets.REGISTRY_USER }} --password-stdin
          docker push ${{ secrets.REGISTRY_URL }}/unprompted/backend:${{ github.sha }}
          docker push ${{ secrets.REGISTRY_URL }}/unprompted/backend:latest
