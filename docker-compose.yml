networks:
  platform:
    driver: bridge

volumes:
  sqlserver_data:

services:

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Unprompted@db}
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks: [ platform ]
    healthcheck:
      test: [ "CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"${MSSQL_SA_PASSWORD:-Unprompted@db}\" -Q 'SELECT 1' -No -C || exit 1" ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ---> AJOUT DE KEYCLOAK <---
  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: keycloak-unprompted
    command: start-dev
    restart: unless-stopped
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_SPI_THEME_STATIC_MAX_AGE: -1
      KC_SPI_THEME_CACHE_TEMPLATES: "false"
      KC_SPI_THEME_CACHE_THEMES: "false"
    ports:
      - "8080:8080"
    networks: [ platform ]
    volumes:
      - ./Frontend/themes/unprompted-theme:/opt/keycloak/themes/unprompted-theme

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5000:5000" # Ton port personnalisé préservé
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5000
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=Unprompted;User Id=sa;Password=${MSSQL_SA_PASSWORD:-Unprompted@db};TrustServerCertificate=True;
      - ConnectionStrings__Redis=redis:6379
      - JwtSettings__Secret=${JWT_SECRET:-super-secret-dev-key-change-in-prod}
      - JwtSettings__ExpiryMinutes=60
      - AiService__BaseUrl=http://ai:8000
    depends_on:
      sqlserver:
        condition: service_healthy
      keycloak:
        condition: service_started
    networks: [ platform ]
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:5000/health || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:5000 # Ton port d'API préservé
    restart: unless-stopped
    ports:
      - "3000:80" # Ton port Frontend préservé
    depends_on:
      - backend
    networks: [ platform ]
