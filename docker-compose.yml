networks:
  platform:
    driver: bridge

volumes:
  sqlserver_data:
  chroma_data:

services:

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Unprompted@db}
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks: [platform]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"${MSSQL_SA_PASSWORD:-Unprompted@db}\" -Q 'SELECT 1' -No -C || exit 1"
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: keycloak-unprompted
    command: start-dev
    restart: unless-stopped
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_SPI_THEME_STATIC_MAX_AGE: -1
      KC_SPI_THEME_CACHE_TEMPLATES: "false"
      KC_SPI_THEME_CACHE_THEMES: "false"
    ports:
      - "8080:8080"
    networks: [platform]
    volumes:
      - ./Frontend/themes/unprompted-theme:/opt/keycloak/themes/unprompted-theme

  backend:
    build:
      context: ./Backend
      dockerfile: DOCKERFILE
    restart: unless-stopped
    ports:
      - "5066:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5000
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=Unprompted;User Id=sa;Password=${MSSQL_SA_PASSWORD:-Unprompted@db};TrustServerCertificate=True;
      - ConnectionStrings__Redis=redis:6379
      - JwtSettings__Secret=${JWT_SECRET:-super-secret-dev-key-change-in-prod}
      - JwtSettings__ExpiryMinutes=60
      - AiService__BaseUrl=http://ai:8000
      - Keycloak__Authority=http://keycloak:8080/realms/unprompted-realm
      - Keycloak__Audience=react-frontend
      - Keycloak__RequireHttpsMetadata=false
      - Keycloak__AdminUrl=http://keycloak:8080
      - Keycloak__RealmName=unprompted-realm
    depends_on:
      sqlserver:
        condition: service_healthy
      keycloak:
        condition: service_started
    networks: [platform]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./Frontend
      dockerfile: DOCKERFILE
      args:
        VITE_API_URL: http://localhost:5066/api
    restart: unless-stopped
    ports:
      - "3001:80"
    depends_on:
      - backend
    networks: [platform]

  chroma-db:
    image: chromadb/chroma:latest
    container_name: chroma_vector_db
    restart: unless-stopped
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chromadb/data
    environment:
      - IS_PERSISTENT=TRUE
    networks: [platform]

  ai:
    build:
      context: ./AI
      dockerfile: DOCKERFILE
    container_name: unprompted_rag
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - CHROMA_SERVER_HOST=chroma-db
      - CHROMA_SERVER_HTTP_PORT=8000
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-un_mot_de_passe_super_secret_pfe_2026}
    depends_on:
      - chroma-db
    hostname: ai
    networks: [platform]
