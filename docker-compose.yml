networks:
  platform:
    driver: bridge

volumes:
  sqlserver_data:

services:

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Unprompted@db}
      MSSQL_PID: Developer                  
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks: [platform]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"${MSSQL_SA_PASSWORD:-Unprompted@db}\" -Q 'SELECT 1' -No -C || exit 1"
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ---> AJOUT DE KEYCLOAK ICI <---
  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: keycloak-unprompted
    command: start-dev
    restart: unless-stopped
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    networks: [platform]

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5000
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=Unprompted;User Id=sa;Password=${MSSQL_SA_PASSWORD:-Unprompted@db};TrustServerCertificate=True;
      # Note: Si tu as toujours l'erreur "Connection refused", tu pourras ajouter la variable d'environnement pour Keycloak ici plus tard !
    depends_on:
      sqlserver:
        condition: service_healthy
      # Ajout de la dépendance à Keycloak
      keycloak:
        condition: service_started
    networks: [platform]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:5000
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks: [platform]