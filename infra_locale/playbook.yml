- name: User Service
  hosts: 
    - User_service
  become: true
  tasks:
    - name: Install Docker dependencies
      apt:
        name:
          - ca-certificates
          - curl
          - gnupg
        state: present
        update_cache: yes

    - name: Add Docker GPG key
      shell: |
        install -m 0755 -d /etc/apt/keyrings
        curl -fsSL https://download.docker.com/linux/ubuntu/gpg | \
          gpg --dearmor -o /etc/apt/keyrings/docker.gpg
        chmod a+r /etc/apt/keyrings/docker.gpg
      args:
        creates: /etc/apt/keyrings/docker.gpg

    - name: Add Docker apt repository
      shell: |
        echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] \
        https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo $VERSION_CODENAME) stable" \
        > /etc/apt/sources.list.d/docker.list
      args:
        creates: /etc/apt/sources.list.d/docker.list

    - name: Install Docker Engine + Compose plugin
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: yes

    - name: Start and enable Docker service
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: Install git
      apt:
        name: git
        state: present

    - name: Clone repo
      git:
        repo: https://github.com/ikrammalki05/Unprompted.git
        dest: /app
        version: Admin_Complet
        force: yes
    - name: Fix Backend Dockerfile casing
      command: mv /app/Backend/DOCKERFILE /app/Backend/Dockerfile
      args:
        creates: /app/Backend/Dockerfile
    - name: Fix frontend Dockerfile casing
      command: mv /app/Frontend/DOCKERFILE /app/Frontend/Dockerfile
      args:
        creates: /app/Frontend/Dockerfile
    - name: Ensure emergency swap space exists for heavy compilation
      become: true
      block:
        - name: Check if swap file already exists
          ansible.builtin.stat:
            path: /swapfile
          register: swap_file_check

        - name: Allocate 4GB swap space if missing
          ansible.builtin.command: fallocate -l 4G /swapfile
          when: not swap_file_check.stat.exists

        - name: Set correct permissions on swap file
          ansible.builtin.file:
            path: /swapfile
            mode: '0600'

        - name: Format the swap file
          ansible.builtin.command: mkswap /swapfile
          when: not swap_file_check.stat.exists

        - name: Activate the swap space
          ansible.builtin.command: swapon /swapfile
          failed_when: false # Prevents crashing if already turned on
    - name: Run community.docker.docker_compose_v2
      community.docker.docker_compose_v2:
        project_src: /app
        state: present